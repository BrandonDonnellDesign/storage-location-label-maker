<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage Location Label Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}.app{max-width:1200px;margin:0 auto;padding:28px}h1{margin:0 0 6px}.subtitle{color:#6b7280;margin:0 0 22px}.panel{background:#fff;border:1px solid #d1d5db;border-radius:12px;padding:20px;margin-bottom:22px;box-shadow:0 2px 8px rgba(0,0,0,.05)}label{display:block;font-weight:700;margin-bottom:8px}textarea{width:100%;min-height:180px;resize:vertical;padding:14px;border:1px solid #9ca3af;border-radius:8px;font:600 16px/1.5 Consolas,monospace}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}button{border:0;border-radius:8px;padding:11px 17px;font-weight:700;cursor:pointer;background:#111827;color:#fff}button.secondary{background:#e5e7eb;color:#111827}button:disabled{opacity:.45;cursor:not-allowed}.count{margin-left:auto;color:#6b7280;font-weight:600}.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.label-card{background:#fff;border:1px solid #d1d5db;padding:12px;border-radius:10px}.label-card .location{font-size:22px;font-weight:900;text-align:center;margin:8px 0 14px;word-break:break-all}.label-card svg{display:block;width:100%;height:auto}.empty{color:#6b7280;text-align:center;padding:50px 20px;border:2px dashed #d1d5db;border-radius:10px}.status{margin-top:12px;min-height:20px;font-size:14px;color:#374151}.status.error{color:#b91c1c}.status.success{color:#166534}
</style>
</head>
<body>
<div class="app">
<h1>Storage Location Label Maker</h1>
<p class="subtitle">Enter one storage location per line, then download a true 4 × 6 inch PDF with one Code 128 label per page.</p>
<div class="panel">
<label for="locations">Storage locations</label>
<textarea id="locations" spellcheck="false" placeholder="SMAHH.34.B.06
SMAHH.34.B.07
SMAHH.34.B.08
SMABB.12.A.01"></textarea>
<div class="controls">
<button id="generate">Generate Labels</button><button class="secondary" id="sample">Load Example</button><button class="secondary" id="clear">Clear</button><button id="pdf" disabled>Download 4×6 PDF</button><span class="count" id="count">0 labels</span>
</div><div id="status" class="status" aria-live="polite"></div>
</div>
<div class="panel"><h2>Preview</h2><div id="preview" class="preview"><div class="empty">Enter locations above and click “Generate Labels”.</div></div></div>
</div>
<script>
const CODE128=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128BValues(text){const vals=[104];for(const ch of text){const code=ch.charCodeAt(0);if(code<32||code>126)return null;vals.push(code-32)}let sum=104;for(let i=1;i<vals.length;i++)sum+=vals[i]*i;vals.push(sum%103,106);return vals}
function barcodeSVG(text){const vals=code128BValues(text);if(!vals)return "";const quiet=10,unit=2;let x=quiet,totalModules=quiet*2;for(const value of vals)totalModules+=CODE128[value].split("").reduce((a,b)=>a+Number(b),0)*unit;let rects="";for(const value of vals){let black=true;for(const digit of CODE128[value]){const w=Number(digit)*unit;if(black)rects+=`<rect x="${x}" y="0" width="${w}" height="100"/>`;x+=w;black=!black}}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalModules} 100" preserveAspectRatio="none" aria-label="Barcode for ${escapeHtml(text)}"><rect width="100%" height="100%" fill="white"/>${rects}</svg>`}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function pdfEscape(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[^\x20-\x7E]/g,'?')}
function getLocations(){return document.getElementById('locations').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}
function setStatus(text,type=''){const el=document.getElementById('status');el.textContent=text;el.className='status '+type}
function generate(){const locations=getLocations(),preview=document.getElementById('preview');preview.innerHTML='';document.getElementById('pdf').disabled=!locations.length;setStatus('');if(!locations.length){preview.innerHTML='<div class="empty">Enter locations above and click “Generate Labels”.</div>';document.getElementById('count').textContent='0 labels';return}for(const loc of locations){if(!code128BValues(loc)){preview.innerHTML='<div class="empty">One or more locations contain unsupported characters. Code 128-B supports printable ASCII characters only.</div>';document.getElementById('pdf').disabled=true;document.getElementById('count').textContent='0 labels';setStatus('Use letters, numbers, spaces, and standard punctuation only.','error');return}const card=document.createElement('div');card.className='label-card';card.innerHTML=`<div class="location">${escapeHtml(loc)}</div>${barcodeSVG(loc)}`;preview.appendChild(card)}document.getElementById('count').textContent=`${locations.length} label${locations.length===1?'':'s'}`}
function makePdf(locations){const W=288,H=432;const objects=[];const add=o=>{objects.push(o);return objects.length};const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');const pages=add('<< /Type /Pages /Kids [] /Count 0 >>');const pageIds=[];for(const loc of locations){const vals=code128BValues(loc);let content='q\n';const size=Math.min(30,Math.max(16,30-Math.max(0,loc.length-12)*0.75));content+=`BT /F1 ${size.toFixed(2)} Tf 1 0 0 1 144 ${360-size} Tm (${pdfEscape(loc)}) Tj ET\n`;const quiet=10,unit=2,total=quiet*2+vals.reduce((n,v)=>n+CODE128[v].split('').reduce((a,b)=>a+Number(b),0),0)*unit;const maxW=258,scale=Math.min(maxW/total,1.8),barH=105;let x=(W-total*scale)/2+quiet*scale;for(const value of vals){let black=true;for(const digit of CODE128[value]){const w=Number(digit)*unit*scale;if(black)content+=`0 0 0 rg ${x.toFixed(3)} 190 ${w.toFixed(3)} ${barH} re f\n`;x+=w;black=!black}}content+='Q';const streamId=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);const pageId=add(`<< /Type /Page /Parent ${pages} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${streamId} 0 R >>`);pageIds.push(pageId)}objects[pages-1]=`<< /Type /Pages /Kids [${pageIds.map(id=>id+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;const catalog=add(`<< /Type /Catalog /Pages ${pages} 0 R >>`);let pdf='%PDF-1.4\n%\xFF\xFF\xFF\xFF\n',offsets=[0];for(let i=0;i<objects.length;i++){offsets[i+1]=pdf.length;pdf+=`${i+1} 0 obj\n${objects[i]}\nendobj\n`}const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objects.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;return new Blob([pdf],{type:'application/pdf'})}
function downloadPdf(){const locations=getLocations();if(!locations.length){generate();return}for(const loc of locations)if(!code128BValues(loc)){setStatus('PDF not created: unsupported characters found.','error');return}try{const blob=makePdf(locations),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='storage-location-labels-4x6.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);setStatus(`Created ${locations.length} label${locations.length===1?'':'s'} in a 4 × 6 inch PDF.`,'success')}catch(e){console.error(e);setStatus('Could not create the PDF. Please try again.','error')}}
document.getElementById('generate').addEventListener('click',generate);document.getElementById('pdf').addEventListener('click',downloadPdf);document.getElementById('sample').addEventListener('click',()=>{document.getElementById('locations').value=`SMAHH.34.B.06\nSMAHH.34.B.07\nSMAHH.34.B.08\nSMAHH.35.A.01\nSMAHH.35.A.02`;generate()});document.getElementById('clear').addEventListener('click',()=>{document.getElementById('locations').value='';generate()});document.getElementById('locations').addEventListener('input',()=>{document.getElementById('count').textContent=`${getLocations().length} label${getLocations().length===1?'':'s'}`;document.getElementById('pdf').disabled=!getLocations().length;setStatus('')});
</script></body></html>
